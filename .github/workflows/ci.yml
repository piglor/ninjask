name: CI

# The README's quick start on a fresh runner, then the checks that define
# "green" (the Areneon fork: Showdown pinned to refsim/SHOWDOWN_COMMIT, docs/repin.md):
#
#   1. cargo fmt, clippy (with and without the Python features) and
#      cargo test --release, after the format export, which the tests that
#      play battles read (they skip without it), all with --locked;
#   2. the behaviour fingerprint on the fixture teams (2000 games), which
#      must print 36adc509dbe129d1 (README, "Run the checks");
#   3. the exports are what refsim/PROVENANCE.json says (the pin, the export
#      tool, a hash of every bundled format);
#   4. exact agreement with pinned Showdown on 200 synthetic games, 200
#      games of the VGCPastes pool (pools/) and 200 games that use No Retreat;
#   5. pytest;
# and, in their own jobs, the supply-chain policy (cargo deny: licences, sources,
# advisories) and `fidelity`, a larger comparison with the pinned Showdown.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned: rust-toolchain.toml
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache the pinned Showdown checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/pokemon-showdown
          key: showdown-${{ hashFiles('refsim/SHOWDOWN_COMMIT') }}

      - name: Install the package (pip install -e '.[test]')
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[test]'

      - name: Build Pokémon Showdown at the pinned commit
        run: ./scripts/setup_showdown.sh

      - name: Export the Reg M-C format
        run: .venv/bin/python -c "import ninjask; ninjask.load('gen9championsvgc2026regmc')"

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo clippy --release --locked --all-targets --features python-module -- -D warnings

      - name: Rust tests
        run: cargo test --release --locked

      - name: Provenance (the pin, the export tool and every exported format)
        run: .venv/bin/python scripts/repin.py provenance check

      - name: Fingerprint (fixture teams, 2000 games)
        run: |
          cargo run --release --locked --example fingerprint -- data/derived/format/gen9championsvgc2026regmc.json tests/fixtures/regmc_teams.txt 2000 | tee fingerprint.txt
          grep -qx "fingerprint 36adc509dbe129d1" fingerprint.txt

      - name: Exact agreement with Showdown (200 synthetic games)
        run: .venv/bin/python scripts/check_reference.py --synthetic --games 200 --workers 4

      - name: Exact agreement with Showdown (200 games of real teams)
        run: .venv/bin/python scripts/check_reference.py --pool pools/vgcpastes-regmc.txt --games 200 --workers 4

      - name: Exact agreement with Showdown (200 games using No Retreat)
        run: .venv/bin/python scripts/check_reference.py --synthetic --require noretreat --games 200 --workers 4

      - name: Python tests
        run: .venv/bin/pytest -q

  # Licences, sources and advisories of the Cargo.lock dependencies (deny.toml).
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features

  # A larger comparison with Showdown at the pin (10 to 15 minutes): reference mode on
  # synthetic and real teams, the chaos teams in three mixes, refused and repeated choices,
  # and the protocol tracker. Every check compares the two simulators after every input.
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned: rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache the pinned Showdown checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/pokemon-showdown
          key: showdown-${{ hashFiles('refsim/SHOWDOWN_COMMIT') }}

      - name: Install the package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[test]'

      - name: Build Pokémon Showdown at the pinned commit
        run: ./scripts/setup_showdown.sh

      - name: Export the Reg M-C format
        run: .venv/bin/python -c "import ninjask; ninjask.load('gen9championsvgc2026regmc')"

      - name: Reference mode, synthetic teams (1500 games)
        run: .venv/bin/python scripts/check_reference.py --synthetic --games 1500 --workers 4

      - name: Reference mode, real teams (400 games)
        run: .venv/bin/python scripts/check_reference.py --pool pools/vgcpastes-regmc.txt --games 400 --workers 4

      - name: Reference mode, the entities of the last pin sync (500 games each)
        run: |
          .venv/bin/python scripts/check_reference.py --synthetic --require noretreat --games 500 --workers 4
          .venv/bin/python scripts/check_reference.py --synthetic --require revivalblessing --games 500 --workers 4

      - name: Chaos teams (600 games in each of three mixes, two seeds)
        run: |
          for seed in 1 2; do
            for mix in chaos wide mixed; do
              .venv/bin/python scripts/check_chaos.py --games 600 --seed "$seed" --mix "$mix" --workers 4
            done
          done

      - name: Pairs of trapping, switching and Revival Blessing mechanics (1224 games)
        # Only ids the engine supports: an unsupported one kills the pool's worker and the run hangs (docs/repin.md).
        run: .venv/bin/python scripts/check_pairs.py --ids noretreat,revivalblessing,meanlook,block,spiritshackle,jawlock,octolock,batonpass,shedtail,ingrain,firespin,whirlpool,uturn,partingshot,imprison,trick,suckerpunch,pollenpuff --games-per-pair 8 --seed 7 --workers 4

      - name: Refused, repeated and replaced choices (300 games)
        run: .venv/bin/python scripts/check_choices.py --games 300 --workers 4

      - name: Protocol tracker (100 games)
        run: .venv/bin/python scripts/check_tracker.py --games 100
