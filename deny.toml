# Supply-chain policy (cargo deny check): the fork's dependencies come from crates.io only,
# under licences compatible with the project's MIT licence, and are pinned by Cargo.lock
# (every build and test uses --locked). Adding a dependency is a reviewed change: read its
# source (no build.rs, no unsafe in what the engine calls, no network or process use) first.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
